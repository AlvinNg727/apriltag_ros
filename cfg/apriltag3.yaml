/**:
  ros__parameters:
    image_transport: raw # image format
    family: 36h11 # tag family name
    size: 0.2 # tag edge size in meter
    max_hamming: 0 # maximum allowed hamming distance (corrected bits)
    qos_profile: sensor_data # optional qos_profile, "sensor_data", "default", or "system_default"
    world_frame: map # optional world frame name for tag positions

    # see "apriltag.h" 'struct apriltag_detector' for more documentation on these optional parameters
    detector:
      threads: 1 # number of threads
      decimate: 1.0 # decimate resolution for quad detection
      blur: 0.0 # sigma of Gaussian blur for quad detection
      refine: True # snap to strong gradients
      sharpening: 0.25 # sharpening of decoded images
      debug: False # write additional debugging images to current working directory

    pose_estimation_method: "pnp" # method for estimating the tag pose

    # optional list of tags
    # tag:
    #   ids: [0, 1, 2, 3] # tag ID
    #   frames: [apriltag_0, apriltag_1, apriltag_2, apriltag_3] # optional frame name
    #   sizes: [0.2, 0.2, 0.2, 0.2] # optional tag-specific edge size
    #   positions: # optional tag-specific xyz in world_frame
    #     0: [0.5, 0.5, 0.0] # tag position in world_frame [x, y, z]
    #     1: [0.5, -0.5, 0.0] # tag position in world_frame [x, y, z]
    #     2: [-0.5, -0.5, 0.0] # tag position in world_frame [x, y, z]
    #     3: [-0.5, 0.5, 0.0] # tag position in world_frame [x, y, z]

    # tag bundle: estimate pose using all detected tags jointly
    # (enabled when tag_bundle.frame is non-empty)
    tag_bundle:
      frame: landing_bundle # frame name for the bundle TF
      ids: [0, 1, 2, 3, 4, 5, 6, 7] # IDs of tags in the bundle
      sizes: [0.2, 0.2, 0.2, 0.2, 0.04, 0.04, 0.04, 0.04] # optional: per-tag edge sizes in the bundle (must match ids count)
      positions: # tag position in bundle frame [x, y, z]
        "0": [-0.5, 0.5, 0.0]
        "1": [0.5, 0.5, 0.0]
        "2": [0.5, -0.5, 0.0]
        "3": [-0.5, -0.5, 0.0]
        "4": [-0.25, 0.35, 0.0]
        "5": [-0.15, 0.25, 0.0]
        "6": [-0.25, 0.15, 0.0]
        "7": [-0.35, 0.25, 0.0]
      # orientations:
      #   0: [0.0, 0.0, 0.0] # optional: per-tag RPY in bundle frame [roll, pitch, yaw] in radians

      position: [-5.0, 5.0, 0.0] # optional: bundle origin in world_frame
      orientation: [0.0, 0.0, 1.5708] # optional: bundle RPY in world_frame [roll, pitch, yaw] in radians
