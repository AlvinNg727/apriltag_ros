/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.28 # Black square of the 0.35 m print, excluding the white border.
    debug_image: false # Set true to publish annotated frames on /apriltag/debug_image.
    max_hamming: 0
    qos_profile: sensor_data
    world_frame: map
    pose_estimation_method: pnp

    # Match the hardware detector settings in tags_36h11.yaml.
    detector:
      threads: 1
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    tag_bundle:
      frame: landing_bundle
      ids: [0, 1, 2, 3, 4, 5, 6, 7]
      sizes: [0.28, 0.28, 0.28, 0.28, 0.08, 0.08, 0.08, 0.08] # Black square sizes in metres.
      positions: # Tag centres relative to the opening centre in the tag plane.
        "0": [0.325, 0.325, 0.0]
        "1": [0.325, -0.325, 0.0]
        "2": [-0.325, -0.325, 0.0]
        "3": [-0.325, 0.325, 0.0]
        "4": [0.2, 0.0, 0.0]
        "5": [0.0, -0.2, 0.0]
        "6": [-0.2, 0.0, 0.0]
        "7": [0.0, 0.2, 0.0]
      position: [5.0, 0.0, 0.0101] # Match the dock pose in actual_dock.sdf.
      orientation: [0.0, 0.0, 0.0]
